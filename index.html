<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GOD IS BORED" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0c12" />
  <meta name="description" content="GOD IS BORED — simulation de vie pour adultes." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <title>GOD IS BORED</title>
  <style>
    html, body { margin: 0; height: 100%; position: fixed; width: 100%; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #0b0c12; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #game { position: fixed; inset: 0; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; color: #e6e9f2; font-size: 13px; }
    #ui .panel { pointer-events: auto; position: absolute; background: rgba(12,14,22,.84); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(6px); }
    /* Écran de chargement (zones de sécurité iPhone respectées) */
    #boot { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #98a2b8; background: radial-gradient(ellipse at 50% 40%, #1b2040 0%, #0b0c12 70%); text-align: center;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); transition: opacity .35s ease; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot img { width: 96px; height: 96px; image-rendering: pixelated; border-radius: 18px; box-shadow: 0 0 40px rgba(255,216,74,.25); animation: bob 2.2s ease-in-out infinite; }
    #boot h1 { margin: 4px 0 0; font-size: 20px; letter-spacing: .28em; color: #ffd84a; font-weight: 700; }
    #boot .bar { width: min(220px, 50vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: #ffd84a; border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
    #boot .msg { font-size: 12px; min-height: 16px; }
    #boot button { pointer-events: auto; touch-action: manipulation; font: inherit; color: #0b0c12; background: #ffd84a; border: 0; border-radius: 10px; padding: 10px 16px; margin: 2px 4px; }
    #boot button.ghost { background: rgba(255,255,255,.12); color: #e6e9f2; }
    #boot .acts { display: none; }
    #boot.stuck .acts { display: block; }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    /* Bandeau de mise à jour */
    #upd { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 12px; background: rgba(12,14,22,.94); border: 1px solid rgba(255,216,74,.45); color: #e6e9f2; font-size: 13px; touch-action: manipulation; }
    #upd button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; background: #ffd84a; color: #0b0c12; }
    #upd button.ghost { background: rgba(255,255,255,.12); color: #e6e9f2; }
  </style>
</head>
<body>
  <div id="boot">
    <img src="/icons/icon-192.png" alt="" />
    <h1>GOD IS BORED</h1>
    <div class="bar"><i></i></div>
    <div class="msg" id="boot-msg">Chargement…</div>
    <div class="acts">
      <button id="boot-reload">Recharger</button>
      <button id="boot-reset" class="ghost">Vider le cache de l'app</button>
    </div>
  </div>
  <div id="game"></div>
  <div id="ui"></div>
  <script>
    // Appelé par le jeu quand la scène est prête ; sécurité si le chargement reste bloqué (ancien cache, réseau coupé…).
    (function () {
      var boot = document.getElementById('boot'), msg = document.getElementById('boot-msg'), finished = false;
      window.__gibBootDone = function () { finished = true; if (boot) { boot.classList.add('done'); setTimeout(function () { boot.remove(); }, 400); } };
      setTimeout(function () { if (finished) return; msg.textContent = 'Le chargement est plus long que prévu…'; boot.classList.add('stuck'); }, 12000);
      window.addEventListener('error', function () { if (!finished) { msg.textContent = 'Une erreur est survenue au chargement.'; boot.classList.add('stuck'); } });
      document.getElementById('boot-reload').onclick = function () { location.reload(); };
      document.getElementById('boot-reset').onclick = async function () {
        msg.textContent = 'Nettoyage du cache… (vos sauvegardes sont conservées)';
        try { var regs = await navigator.serviceWorker.getRegistrations(); for (var r of regs) await r.unregister(); var ks = await caches.keys(); for (var k of ks) await caches.delete(k); } catch (e) {}
        location.reload();
      };
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
