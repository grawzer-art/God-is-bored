<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0c12" />
  <title>GOD IS BORED</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c12; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #game { position: fixed; inset: 0; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; color: #e6e9f2; font-size: 13px; }
    #ui .panel { pointer-events: auto; position: absolute; background: rgba(12,14,22,.84); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(6px); }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #98a2b8; background: #0b0c12; z-index: 5; }
  </style>
</head>
<body>
  <div id="boot">Chargement de GOD IS BORED…</div>
  <div id="game"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
